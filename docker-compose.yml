# Local development stack: PostgreSQL + API + web app.
# Production uses Neon, Render and Vercel instead (see DEPLOYMENT_GUIDE.md).
# The credentials below are throwaway local values, not secrets.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: memed
      POSTGRES_PASSWORD: memed_local_only
      POSTGRES_DB: memed
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memed"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://memed:memed_local_only@db:5432/memed
      DIRECT_URL: postgresql://memed:memed_local_only@db:5432/memed
      JWT_SECRET: local-development-secret-change-me-0123456789
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
    ports: ["4000:4000"]

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://backend:4000" }
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
